# SonarQube Cloud analysis for Ubuntu Hello.
#
# Run it with scripts/ci-sonar.sh (Docker, sonarsource/sonar-scanner-cli) —
# locally and from the `sonar` job in .github/workflows/check.yml. The scanner
# reads this file from the repository root because that is its mandated base
# directory (AGENTS.md §4.7.1 root exception, same class as VERSION/meson.build).
#
# Keys must match the project as it exists in SonarQube Cloud; they follow the
# organisation/repo convention used when the GitHub repo is imported.
sonar.organization=ventura8
sonar.projectKey=ventura8_Ubuntu-Hello
sonar.projectName=Ubuntu Hello
sonar.host.url=https://sonarcloud.io

# VERSION is the single source of truth (AGENTS.md §4.7.2); ci-sonar.sh passes
# -Dsonar.projectVersion from scripts/read-version.py, so it is not pinned here.

# The build is C++17 (meson.build: cpp_std=c++17). Without this the C++ analyser
# reports against a newer standard and suggests C++20/23-only constructs
# (std::format, using enum, std::string_view::contains) that cannot compile here.
sonar.cfamily.reportingCppStandardOverride=c++17

# Analysed tree. Deeper C++ analysis (full semantic, not just the standalone
# sensor) additionally needs sonar.cfamily.compile-commands pointed at the meson
# build dir's compile_commands.json (see docs/INSTRUCTIONS.md).
sonar.sources=ubuntu-hello/src,ubuntu-hello-gtk/src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python coverage: Cobertura XML produced by UH_CI_STAGE=coverage
# (scripts/ci-docker.sh -> run_pytest_coverage).
sonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml
sonar.python.version=3.12, 3.13

# Generated, vendored or non-source trees that must never reach the scanner.
sonar.exclusions=\
  **/build-ci-*/**,\
  **/build-*/**,\
  **/artifacts/**,\
  **/.cache/**,\
  **/.claude/**,\
  **/po/**,\
  **/*.po,\
  **/*.pot

# Test code is analysed, but coverage-of-tests is meaningless.
sonar.coverage.exclusions=tests/**

# ---------------------------------------------------------------------------
# Scoped rule exclusions.
#
# These are Sonar rules that misread this project's idioms. AGENTS.md §4.8 bans
# in-code suppressions (NOSONAR / # noqa), so the scoping lives here instead —
# narrowly, per rule and per path, never repo-wide. Each entry records WHY;
# do not widen one without the same justification.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=gtkcss,gtkparam,gtkcb,v4l2names,kwalletkdf,notifyapi,buildargv,worldreadcfg,gettextdup,gettextdup2,wgethttps,selfelevate,pamcabi,pamstrlen,pamitem,lambdaret,pamunlock,v4l2types,stamprule

# GTK CSS uses widget type selectors (headerbar, notebook, entry, treeview,
# checkbutton). The CSS analyser assumes HTML and flags them as unknown tags.
sonar.issue.ignore.multicriteria.gtkcss.ruleKey=css:S4670
sonar.issue.ignore.multicriteria.gtkcss.resourceKey=ubuntu-hello-gtk/src/style.css

# GTK signal handlers must keep the full callback signature (button/switch/
# notebook) even when the body ignores it — GTK calls them positionally.
sonar.issue.ignore.multicriteria.gtkparam.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.gtkparam.resourceKey=ubuntu-hello-gtk/src/**

# GTK/GLib callbacks return a fixed protocol constant by contract: "state-set"
# returns False so GTK applies the switch, timeouts return SOURCE_REMOVE.
# "Always returns the same value" is the correct behaviour here.
sonar.issue.ignore.multicriteria.gtkcb.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.gtkcb.resourceKey=ubuntu-hello-gtk/src/**

# v4l2.py mirrors the kernel's videodev2.h ioctl macros (_IOC, _IOW,
# V4L2_CTRL_ID_MASK, …) and enroll_capture.py defines the gettext no-op marker
# N_. Renaming either breaks the correspondence the code exists to preserve.
sonar.issue.ignore.multicriteria.v4l2names.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.v4l2names.resourceKey=ubuntu-hello/src/**

# kwallet-pam's own PBKDF2-SHA512 parameters (50000 iterations, 56-byte salt and
# key). They are dictated by KWallet's on-disk format — raising the iteration
# count would derive a different key and break unsealing for every KDE user.
sonar.issue.ignore.multicriteria.kwalletkdf.ruleKey=python:S5344
sonar.issue.ignore.multicriteria.kwalletkdf.resourceKey=ubuntu-hello/src/keyring_restore.py

# notify.py's card methods share one positional signature across every result
# kind (success/timeout/failure); "elapsed" is part of that contract even where
# a given card does not print it.
sonar.issue.ignore.multicriteria.notifyapi.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.notifyapi.resourceKey=ubuntu-hello/src/notify.py

# S8707 models argv as attacker-controlled ("LLM-supplied CLI arguments"). These
# three are build/install-time scripts: install_config.py and download_models.py
# are invoked by Meson and packaging with paths the build system chose, and
# config_edit.py is the root-run config CLI. The caller is already privileged, so
# the taint source does not exist here — and adding path rewriting would break
# DESTDIR staging across the seven packaging formats.
sonar.issue.ignore.multicriteria.buildargv.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.buildargv.resourceKey=ubuntu-hello/src/**

# 0644 on config.ini and the PAM service file is deliberate and specified:
# /etc/ubuntu-hello holds non-secret configuration that the PAM module reads as
# the authenticating user. docs/SECURITY.md documents the modes and tests/vm/
# asserts them on a clean install. Secrets use 0600/0700 and are not in scope
# here (tpm-keys/, sealed blobs).
sonar.issue.ignore.multicriteria.worldreadcfg.ruleKey=python:S2612
sonar.issue.ignore.multicriteria.worldreadcfg.resourceKey=**/*.py

# S1192 flags repeated gettext strings, but a translatable literal must appear
# literally inside _() for xgettext to extract it. Hoisting it to a module
# constant would either evaluate _() before the locale is installed or drop the
# msgid from the catalogs entirely (AGENTS.md §4.7.0). Non-translated duplicate
# literals elsewhere are still reported and were extracted to constants.
sonar.issue.ignore.multicriteria.gettextdup.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.gettextdup.resourceKey=ubuntu-hello/src/notify.py
sonar.issue.ignore.multicriteria.gettextdup2.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.gettextdup2.resourceKey=ubuntu-hello-gtk/src/onboarding.py

# wget's --https-only is the real fix here: it keeps every redirect hop on HTTPS,
# which is the property the rule is about. S6506 only recognises --max-redirect=0,
# and that cannot be used — the github.com/.../raw/ URLs redirect to
# raw.githubusercontent.com by design, so disabling redirects breaks the download.
# The curl branch uses --proto '=https' --proto-redir '=https' and is clean.
sonar.issue.ignore.multicriteria.wgethttps.ruleKey=shell:S6506
sonar.issue.ignore.multicriteria.wgethttps.resourceKey=ubuntu-hello/src/dlib-data/install.sh

# window.elevate() re-executes *this* process under pkexec so the user can
# authenticate to raise their own privileges. The argv it forwards is that same
# user's, and it is passed to os.execvp as a list — never a shell — so a value
# cannot split into extra arguments. The taint source the rule assumes (an
# untrusted caller supplying argv) does not exist on this path.
sonar.issue.ignore.multicriteria.selfelevate.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.selfelevate.resourceKey=ubuntu-hello-gtk/src/window.py

# The PAM module talks to C ABIs that mandate these casts: execve() takes
# "char *const argv[]" so string literals must shed const; pam_get_user(),
# pam_get_authtok() and pam_get_item() take "const char **"/"const void **";
# OpenSSL's EVP_* take "unsigned char *". Rewriting them would not compile, and
# clang-tidy already gates this directory with bugprone-*/modernize-* as errors.
sonar.issue.ignore.multicriteria.pamcabi.ruleKey=cpp:S859
sonar.issue.ignore.multicriteria.pamcabi.resourceKey=ubuntu-hello/src/pam/**

# strlen on the NUL-terminated C strings PAM hands back (username, authtok,
# service). Every call site null-checks first, and there is no std::string to
# take a size from — the pointer is the API's own.
sonar.issue.ignore.multicriteria.pamstrlen.ruleKey=cpp:S5813
sonar.issue.ignore.multicriteria.pamstrlen.resourceKey=ubuntu-hello/src/pam/**

# pam_get_item() returns its payload through "const void **", so reaching the
# typed pointer (pam_conv *, the service/authtok strings) requires
# reinterpret_cast. This is the documented PAM calling convention.
sonar.issue.ignore.multicriteria.pamitem.ruleKey=cpp:S3630
sonar.issue.ignore.multicriteria.pamitem.resourceKey=ubuntu-hello/src/pam/**

# Direct conflict with the enforced lint gate: .clang-tidy runs
# modernize-use-trailing-return-type with WarningsAsErrors, which *requires* the
# trailing return type on these lambdas. S3574 asks to delete it. clang-tidy is
# the gate that must pass, so the trailing return types stay.
sonar.issue.ignore.multicriteria.lambdaret.ruleKey=cpp:S3574
sonar.issue.ignore.multicriteria.lambdaret.resourceKey=ubuntu-hello/src/pam/**

# identify() takes a std::unique_lock and then unlocks it explicitly before the
# later I/O, so clang-analyzer does not read that I/O as BlockInCriticalSection
# (the comment at the call site says so). unique_lock tracks ownership, so the
# destructor does not double-unlock. The asymmetry is deliberate and correct.
sonar.issue.ignore.multicriteria.pamunlock.ruleKey=cpp:S8473
sonar.issue.ignore.multicriteria.pamunlock.resourceKey=ubuntu-hello/src/pam/main.cc

# v4l2.py mirrors the kernel's videodev2.h struct names (v4l2_mpeg_vbi_ITV0 and
# friends) one-for-one; renaming them to PEP 8 would break the correspondence
# that makes the ioctl layer auditable against the header. Same reason as the
# S1542 entry above.
sonar.issue.ignore.multicriteria.v4l2types.ruleKey=python:S101
sonar.issue.ignore.multicriteria.v4l2types.resourceKey=ubuntu-hello/src/recorders/v4l2.py

# The rubberstamp rule pattern. Two real ambiguities were removed while chasing
# this (a redundant (.*)? quantifier, and a \\s* directly before .* where a space
# could match either), but S8786 still reports it. What remains is anchored at
# both ends and ends in .*$, which always succeeds, so there is no input that
# makes it backtrack super-linearly. Rules come from root-owned config.ini, not
# from user input.
sonar.issue.ignore.multicriteria.stamprule.ruleKey=python:S8786
sonar.issue.ignore.multicriteria.stamprule.resourceKey=ubuntu-hello/src/rubberstamps/__init__.py
