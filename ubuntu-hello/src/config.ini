# Ubuntu Hello config file
# Press CTRL + X to save in the nano editor

[core]
# Print that face detection is being attempted
detection_notice = false

# Print that face detection has timed out
timeout_notice = true

# Do not print anything when a face verification succeeds
no_confirmation = false

# When a user without a known face model tries to use this script, don't
# show an error but fail silently
suppress_unknown = false

# Disable Ubuntu Hello in remote shells
abort_if_ssh = true

# Disable Ubuntu Hello if lid is closed
abort_if_lid_closed = true

# Disable ubuntu-hello in the PAM
# The ubuntu-hello command will still function
disabled = false

# A comma-separated list of PAM services that Ubuntu Hello should ignore/skip
ignore_services = 

# Use CNN instead of HOG
# CNN model is much more accurate than the HOG based model, but takes much more
# power to run, and is meant to be executed on a GPU to attain reasonable speed.
use_cnn = false

# Set a workaround to do face and password authentication at the same time
#  off     user will have to press enter themselves after a Ubuntu Hello timeout
#  input   will send an enter keypress to stop the password prompt
#  native  will stop the prompt at PAM level (can lead to instability!)
#
# HARD RULE: with off, do NOT special-case greeters to force pam_get_authtok or
# wrap PAM_CONV. That breaks GDM user-selection → login (immediate bounce back
# to the account list). See AGENTS.md / .agents/skills/pam-verifier.
workaround = off

# After a completed face failure on legacy *screensaver* PAM services, skip
# face until the user successfully authenticates. GNOME lock uses gdm-password
# (same as login) — skip is intentionally NOT applied there so Esc→Enter can
# retry face. sudo/polkit are unaffected. Cleared on face success and in
# pam_sm_setcred.
skip_face_after_failure = true

# Abort the running face scan (release camera, close the auth UI) after
# observing the current login1 session's IdleHint go from false to true.
# An IdleHint that is already true when the scan starts does NOT trigger
# this -- only a false -> true transition during the scan does, so waking
# an already-idle lock screen is not treated as a cancel.
# This is compare.py polling its own session's state via `busctl` and
# deciding to bail out on its own -- it does not touch PAM-level password
# watching. Fails open: if busctl or logind are unavailable, this has no
# effect and the scan runs to its normal timeout as before.
# NOTE: live-tested on GNOME/GDM -- IdleHint does not actually change when
# Esc at a lock screen falls back to the idle/clock view, so this option
# does not help with that specific case there; it is a best-effort, mostly
# dormant safety net for platforms where IdleHint does reflect UI state.
abort_on_session_idle = true

[video]
# The certainty of the detected face belonging to the user of the account
# On a scale from 1 to 10, values above 5 are not recommended
# The lower, the more accurate. IR cameras often need ~4.0–4.5; re-add models
# if matches stay just above the threshold.
certainty = 4.2

# The number of seconds to search for a face after the first usable frame.
# Dark/black IR warm-up frames do not consume this window (see acquisition_timeout).
timeout = 8

# Max seconds from loop start to wait for the first non-dark frame (-1 = auto:
# max(timeout*2, timeout+6)). After that, exit as too-dark / no frames.
acquisition_timeout = -1

# The path of the device to capture frames from
# Video devices are usually found in /dev/v4l/by-path/
device_path = none

# Print a warning if the the video device is not found
warn_no_device = true

# Scale down the video feed to this maximum height
# Speeds up face recognition but can make it less precise
max_height = 320

# Set the camera input profile to this width and height
# The largest profile will be used if set to -1
# Automatically ignored if not a valid profile
frame_width = -1
frame_height = -1

# Because of flashing IR emitters, some frames can be completely unlit
# Skip the frame if the lowest 1/8 of the histogram is above this percentage
# of the total
# The lower this setting is, the more dark frames are ignored
dark_threshold = 60

# The recorder to use. Can be either opencv (default), ffmpeg or pyv4l2.
# Switching from the default opencv to ffmpeg can help with grayscale issues.
recording_plugin = opencv

# Video format used by ffmpeg. Options include vfwcap or v4l2.
# FFMPEG only.
device_format = v4l2

# Force the use of Motion JPEG when decoding frames, fixes issues with YUYV
# raw frame decoding.
# OPENCV only.
force_mjpeg = false

# Specify exposure value explicitly. This disables autoexposure.
# Use qv4l2 to determine an appropriate value.
# OPENCV only.
exposure = -1

# Specify frame rate of the capture device.
# Some IR emitters will not function properly at the default framerate.
# Use qv4l2 to determine an appropriate value.
# OPENCV only.
device_fps = -1

# Rotate captured frames so faces are upright.
#  0  Check landscape orientation only
#  1  Check both landscape and portrait orientation
#  2  Check portrait orientation only
rotate = 0

[snapshots]
# Capture snapshots of failed login attempts and save them to disk with metadata
# Snapshots are saved to /var/log/ubuntu-hello/snapshots
save_failed = false

# Do the same as the option above but for successful attempts
save_successful = false

[rubberstamps]
# Enable specific extra checks after the user has been recognised
enabled = false

# What type of stamps to run and with what options. The type, timeout and
# failure mode are required. One line per stamp. Rule syntax:
#  stamptype  timeout  (failsafe | faildeadly)   [extra_argument=value]
stamp_rules =
	nod		5s		failsafe     min_distance=12

[debug]
# Show a short but detailed diagnostic report in console
# Enabling this can cause some UI apps to fail, only enable it to debug
end_report = false

# More verbose logging from the rubberstamps system
verbose_stamps = false

# Pass output of the GTK auth window to the terminal
gtk_stdout = false
