# Runtime state for Ubuntu Hello (cleared on reboot).
#   face-skip/  greeter face-skip markers written by pam_ubuntu_hello.so
#   notify/     per-user desktop-notification ids written by compare.py (root)
# Created at boot so the polkit agent helper's ReadWritePaths bind (see the
# polkit-agent-helper@.service drop-in) always applies; both are root-only.
d /run/ubuntu-hello 0700 root root -
d /run/ubuntu-hello/notify 0700 root root -
