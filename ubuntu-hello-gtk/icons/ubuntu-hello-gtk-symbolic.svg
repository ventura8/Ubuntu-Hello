<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
<!-- Symbolic variant of the app icon: the same face + check silhouette, built
     from fills only with even-odd holes (eyes, smile, badge clearance, check)
     so the shell can recolour the single colour; strokes would not be
     recoloured. The clearance hole is the exact face/badge lens, so it never
     paints outside the face. -->
  <title>Ubuntu Hello (symbolic)</title>
  <g fill="#2e3436" fill-rule="evenodd">
    <path d="M 7 1.2 A 5.8 5.8 0 1 0 7 12.8 A 5.8 5.8 0 1 0 7 1.2 Z M 4.9 5.0 A 0.9 0.9 0 1 0 4.9 6.8 A 0.9 0.9 0 1 0 4.9 5.0 Z M 9.1 5.0 A 0.9 0.9 0 1 0 9.1 6.8 A 0.9 0.9 0 1 0 9.1 5.0 Z M 4.0 8.2 A 3.6 3.6 0 0 0 10.0 8.2 A 6 6 0 0 1 4.0 8.2 Z M 12.794 7.261 A 4.5 4.5 0 0 0 7.261 12.794 A 5.8 5.8 0 0 0 12.794 7.261 Z"/>
    <path d="M 11.6 8.2 A 3.4 3.4 0 1 0 11.6 15.0 A 3.4 3.4 0 1 0 11.6 8.2 Z M 9.3 11.7 L 10.1 10.9 L 11.1 11.9 L 13.2 9.8 L 14.0 10.6 L 11.1 13.5 Z"/>
  </g>
</svg>
