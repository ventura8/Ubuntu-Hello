name: PPA Release

# Trigger on version tags like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'

env:
  PPA_NAME: "ppa:ventura8/ubuntu-hello"
  MAINTAINER_NAME: "ventura8"
  MAINTAINER_EMAIL: "alexandrescu.sergiu@gmail.com"
  PPA_IMAGE: "ubuntu-hello-ppa:26.04"

jobs:
  upload-to-ppa:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # Target Ubuntu releases in the changelog — build host is always Ubuntu 26.04 Docker
        distro: [noble, resolute]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Build Ubuntu 26.04 PPA image
        run: |
          chmod +x scripts/ppa-docker.sh
          docker build -f docker/Dockerfile.ppa -t "${PPA_IMAGE}" .

      - name: Build signed source and upload in Docker (ubuntu:26.04)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker run --rm \
            -e GPG_PRIVATE_KEY \
            -e GPG_PASSPHRASE \
            -e VERSION \
            -e DISTRO=${{ matrix.distro }} \
            -e MAINTAINER_NAME \
            -e MAINTAINER_EMAIL \
            -e UPLOAD_PPA=1 \
            -v "$PWD:/src:rw" \
            -w /src \
            "${PPA_IMAGE}" \
            ./scripts/ppa-docker.sh

      - name: Summary
        run: |
          echo "## ✅ PPA Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ matrix.distro }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build image:** ubuntu:26.04" >> $GITHUB_STEP_SUMMARY
          echo "- **PPA:** ${PPA_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "sudo add-apt-repository ${PPA_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "sudo apt update" >> $GITHUB_STEP_SUMMARY
          echo "sudo apt install ubuntu-hello" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Also create a GitHub Release with the .deb artifacts
  github-release:
    runs-on: ubuntu-26.04
    needs: upload-to-ppa
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Build binary packages in Docker (ubuntu:26.04)
        run: |
          chmod +x scripts/ppa-docker.sh
          docker build -f docker/Dockerfile.ppa -t "${PPA_IMAGE}" .
          docker run --rm \
            -e BUILD_BINARY=1 \
            -v "$PWD:/src:rw" \
            -w /src \
            "${PPA_IMAGE}" \
            ./scripts/ppa-docker.sh binary
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
