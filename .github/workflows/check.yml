name: Build & Check

on: [push, pull_request]

jobs:
  # Fail-fast quality stages (parallel with each other)
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Lint in Docker (ubuntu:26.04)
        env:
          DOCKER_BUILDKIT: "1"
          UH_CI_DOCKER_CACHE: gha
        run: |
          chmod +x scripts/ci-docker.sh
          UH_CI_STAGE=lint ./scripts/ci-docker.sh

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Coverage in Docker (ubuntu:26.04)
        env:
          DOCKER_BUILDKIT: "1"
          UH_CI_DOCKER_CACHE: gha
        run: |
          chmod +x scripts/ci-docker.sh
          UH_CI_STAGE=coverage ./scripts/ci-docker.sh

  # DE compatibility matrix — only after lint + coverage are green
  compat:
    needs: [lint, coverage]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        de: [baseline, gnome, kde, xfce, cinnamon, mate, budgie, lxqt]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Compat build/test in Docker (${{ matrix.de }})
        env:
          DOCKER_BUILDKIT: "1"
          UH_CI_DOCKER_CACHE: gha
        run: |
          chmod +x scripts/ci-docker.sh
          UH_CI_STAGE=compat UH_CI_DE=${{ matrix.de }} ./scripts/ci-docker.sh

  # Verify debian packaging builds successfully (Ubuntu 26.04 Docker)
  deb-package:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build debian package in Docker (ubuntu:26.04)
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          chmod +x scripts/ppa-docker.sh
          docker build -f docker/Dockerfile.ppa -t ubuntu-hello-ppa:26.04 .
          docker run --rm \
            -e BUILD_BINARY=1 \
            -v "$PWD:/src:rw" \
            -w /src \
            ubuntu-hello-ppa:26.04 \
            ./scripts/ppa-docker.sh binary
          echo "✔ Package built successfully"
          ls -la artifacts/
