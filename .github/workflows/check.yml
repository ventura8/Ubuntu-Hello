name: Build & Check

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel stale runs when the same PR or branch gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# OSS public-repo concurrency: GitHub grants up to 20 parallel runners.
# Job definitions expand to 17 concurrent runners (lint + coverage + 8× compat +
# 7× packaging) with no needs gates. Local ./scripts/ci-pipeline.sh mirrors this
# fail-fast: lint → coverage → compat matrix → packaging matrix (same cell script).

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # buildx's GHA cache backend (type=gha) needs ACTIONS_RESULTS_URL /
      # ACTIONS_RUNTIME_TOKEN exported explicitly -- setup-buildx-action does
      # not do this, so `--cache-to/from type=gha` in ci-docker.sh silently
      # runs without a working cache backend without this step.
      - name: Expose GitHub Actions cache runtime vars
        uses: crazy-max/ghaction-github-runtime@v4.0.0

      - name: Lint in Docker (ubuntu:26.04)
        env:
          DOCKER_BUILDKIT: "1"
          UH_CI_DOCKER_CACHE: gha
        run: |
          chmod +x scripts/ci-docker.sh
          UH_CI_STAGE=lint ./scripts/ci-docker.sh

  coverage:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          # Full history: SonarQube Cloud (scanned below in this same job)
          # attributes new code to commits and needs more than a shallow clone.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Expose GitHub Actions cache runtime vars
        uses: crazy-max/ghaction-github-runtime@v4.0.0

      - name: Coverage in Docker (ubuntu:26.04)
        env:
          DOCKER_BUILDKIT: "1"
          UH_CI_DOCKER_CACHE: gha
        run: |
          chmod +x scripts/ci-docker.sh
          UH_CI_STAGE=coverage ./scripts/ci-docker.sh

      # The Docker stage above runs as root against the bind-mounted checkout, so
      # it leaves root-owned __pycache__/, build-ci-coverage/ (some dirs 0700) and
      # artifacts/coverage/coverage.xml behind. The scan action runs as the runner
      # user and walks the whole tree before sonar.exclusions apply, so without
      # this it dies with AccessDeniedException. (scripts/ci-sonar.sh sidesteps
      # the same problem locally by running its scanner container as root.)
      - name: Reclaim workspace from the root-owned Docker stage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      # SonarQube Cloud runs here rather than in its own job: the Cobertura XML
      # the scan uploads is produced by the step above, and a separate job would
      # need a job dependency gate, which check.yml does not allow. The action (not
      # scripts/ci-sonar.sh) fills in PR-decoration parameters from the Actions
      # context. Skipped on fork PRs, which cannot read the secret.
      - name: SonarQube Cloud scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  compat:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        de: [baseline, gnome, kde, xfce, cinnamon, mate, budgie, lxqt]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Expose GitHub Actions cache runtime vars
        uses: crazy-max/ghaction-github-runtime@v4.0.0

      - name: Compat build/test in Docker (${{ matrix.de }})
        env:
          DOCKER_BUILDKIT: "1"
          UH_CI_DOCKER_CACHE: gha
        run: |
          chmod +x scripts/ci-docker.sh
          UH_CI_STAGE=compat UH_CI_DE=${{ matrix.de }} ./scripts/ci-docker.sh

  # Packaging smoke + live E2E — same scripts/ci-packaging-cell.sh as local
  # ci-pipeline.sh. Skip fork PRs (untrusted Docker/snapcraft/privileged builds).
  packaging:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        format: [deb, rpm-fedora, rpm-opensuse, arch, snap, appimage, flatpak]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Packaging cell ${{ matrix.format }} (build + smoke + E2E)
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          chmod +x scripts/ci-packaging-cell.sh
          ./scripts/ci-packaging-cell.sh "${{ matrix.format }}"

  # Booted-OS tier: a real Ubuntu under QEMU/KVM with an emulated TPM, exercising
  # what containers cannot host (PAM as a login path, the polkit helper sandbox,
  # a TPM, reboot persistence, package install/upgrade/remove on a real root).
  # The packages under test are built from this commit by the deb packaging cell,
  # so the tier checks the tree, not the PPA's last published build. It is slow
  # (~20 min), so it runs on release branches and on demand.
  vm:
    if: startsWith(github.ref, 'refs/heads/feature/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            cell: deb
          - distro: fedora
            cell: rpm-fedora
          - distro: arch
            cell: arch
    name: vm (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Expose GitHub Actions cache runtime vars
        uses: crazy-max/ghaction-github-runtime@v4.0.0
      - name: Build the ${{ matrix.distro }} packages from this commit
        env:
          DOCKER_BUILDKIT: "1"
          UH_PACKAGING_ARTIFACTS_ISOLATE: "1"
        run: |
          chmod +x scripts/ci-packaging-cell.sh
          ./scripts/ci-packaging-cell.sh ${{ matrix.cell }}
          ls -la artifacts/ci-packaging/${{ matrix.cell }}/
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Install QEMU, swtpm and cloud-init image tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils swtpm swtpm-tools cloud-image-utils openssh-client python3-pytest
      - name: Boot a clean ${{ matrix.distro }} and run the scenarios
        env:
          UH_VM: "1"
          UH_VM_CPUS: "4"
          UH_VM_MEM_MB: "6144"
          UH_VM_DISTROS: ${{ matrix.distro }}
          UH_VM_PKG_DIR: ${{ github.workspace }}/artifacts/ci-packaging/${{ matrix.cell }}
        run: |
          chmod +x scripts/vm/vm.sh
          python3 -m pytest tests/vm/ -v --tb=short
      - name: Keep the scenario logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vm-scenario-results-${{ matrix.distro }}
          path: |
            .cache/vm/results/
            .cache/vm/*console.log
          if-no-files-found: ignore
